<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('board');

function el(tag,attrs){
  const e=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  return e;
}

// ══════════════════════════════════════════════════════════
// SCORING TRACK — 1 point per box, clockwise perimeter
// ══════════════════════════════════════════════════════════
(function(){
  const g=document.getElementById('track');
  const BW=26, BH=20, HP=30, VP=24;
  const xL=34, xR=1078, yT=34, yB=752;

  const boxes=[];
  // Top L→R
  for(let x=xL; x+BW<=xR+8; x+=HP){ if(x>xR-BW) break; boxes.push({x,y:yT,w:BW,h:BH}); }
  const topN=boxes.length;
  // Right T→B
  const rX=xR-BW+2;
  for(let y=yT+VP; y+BH<=yB+8; y+=VP){ if(y>yB-BH) break; boxes.push({x:rX,y,w:BW,h:BH}); }
  const rightN=boxes.length-topN;
  // Bottom R→L
  for(let x=xR-HP; x>=xL; x-=HP){ if(x+BW<xL+BW) break; boxes.push({x,y:yB,w:BW,h:BH}); }
  const botN=boxes.length-topN-rightN;
  // Left B→T
  for(let y=yB-VP; y>=yT+VP; y-=VP){ if(y<yT+VP) break; boxes.push({x:xL,y,w:BW,h:BH}); }

  const total=boxes.length;

  // Arrows
  for(let i=0;i<total;i++){
    const a=boxes[i], b=boxes[(i+1)%total];
    const ax=a.x+a.w/2, ay=a.y+a.h/2, bx=b.x+b.w/2, by=b.y+b.h/2;
    const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy);
    if(len<2) continue;
    const ux=dx/len, uy=dy/len, s=Math.max(a.w,a.h)/2+1, s2=Math.max(b.w,b.h)/2+1;
    g.appendChild(el('line',{x1:ax+ux*s,y1:ay+uy*s,x2:bx-ux*s2,y2:by-uy*s2,stroke:'#c9a96e','stroke-width':'0.8',opacity:'0.35'}));
  }

  // Boxes
  boxes.forEach((p,i)=>{
    const fill=i===0?'#e8d8b0':i%10===0?'#f5ead0':i>=100?'#faf4e8':'#f0e8d4';
    const sw=i===0?'1.5':i%10===0?'1.2':'0.8';
    const sc=i%10===0&&i>0?'#b8960b':'#a08060';
    const r=el('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:'3',fill,stroke:sc,'stroke-width':sw,cursor:'pointer','data-tip':'<b>得分 '+i+'</b>'+(i%10===0&&i>0?' · 十分节点':'')});
    g.appendChild(r);

    let txt;
    if(i===0){
      txt=el('text',{x:p.x+p.w/2,y:p.y+p.h/2+1,'text-anchor':'middle','dominant-baseline':'central','font-family':'Georgia,serif','font-size':'7','font-weight':'bold',fill:'#8B6914','pointer-events':'none'});
      txt.textContent='START';
    } else {
      const fs=i%10===0?'9':i>=100?'7':'8';
      const fw=i%10===0?'bold':'normal';
      const fc=i%10===0?'#5a3d2b':'#7a6a5a';
      txt=el('text',{x:p.x+p.w/2,y:p.y+p.h/2+1,'text-anchor':'middle','dominant-baseline':'central','font-family':'Georgia,serif','font-size':fs,'font-weight':fw,fill:fc,'pointer-events':'none'});
      txt.textContent=i;
    }
    g.appendChild(txt);
  });

  // Title
  const t=el('text',{x:'570',y:'24','text-anchor':'middle','font-family':'Georgia,serif','font-size':'9',fill:'#8B7355','letter-spacing':'3'});
  t.textContent='得分轨道 · 顺时针 · 1分/格 · 共'+total+'格';
  g.appendChild(t);

  // START marker
  const s0=boxes[0];
  const m=el('text',{x:s0.x+s0.w/2,y:s0.y+s0.h+9,'text-anchor':'middle','font-size':'8',fill:'#c9a96e','font-family':'Georgia,serif'});
  m.textContent='▲ START';
  g.appendChild(m);
})();

// ══════════════════════════════════════════════════════════
// HEXAGONAL DEPOT LAYOUT — 6 depots around black market
// ══════════════════════════════════════════════════════════
(function(){
  const g=document.getElementById('hex-area');

  // Hex layout params — R=260 ensures tiles clear the perimeter scoring track
  const CX=570, CY=430;   // center (black market)
  const R=260;             // radius from center to depot card center
  const CW=130, CH=104;   // depot card size

  // Depot angles: top=0°, clockwise every 60°
  const angles=[0, 60, 120, 180, 240, 300]; // degrees
  const depotNums=[1,2,3,4,5,6];

  // Hex tile helper
  function hexPts(cx,cy,w,h){
    const hw=w/2, hh=h/2, qw=w/4;
    return `${cx},${cy-hh} ${cx+hw},${cy-qw} ${cx+hw},${cy+qw} ${cx},${cy+hh} ${cx-hw},${cy+qw} ${cx-hw},${cy-qw}`;
  }

  // Per-depot radius: depot 1 (top) and 4 (bottom) are 100px closer to center
  const depotR=num=>(num===1||num===4)?R-100:R-20;

  // Wrapper group: scale all depots 1.15x around (CX, CY) so everything scales proportionally
  const dWrap=el('g',{transform:`translate(${CX*(1-1.15)},${CY*(1-1.15)}) scale(1.15)`});

  // Draw connection lines from center to each depot (subtle)
  angles.forEach((deg,idx)=>{
    const num=depotNums[idx];
    const rad=deg*Math.PI/180;
    const r=depotR(num);
    const ex=CX+r*Math.sin(rad), ey=CY-r*Math.cos(rad);
    dWrap.appendChild(el('line',{x1:CX,y1:CY,x2:ex,y2:ey,stroke:'#c9a96e','stroke-width':'0.8',opacity:'0.15','stroke-dasharray':'4 4'}));
  });

  // Draw each depot
  angles.forEach((deg,idx)=>{
    const num=depotNums[idx];
    const rad=deg*Math.PI/180;
    const r=depotR(num);
    let dx=CX+r*Math.sin(rad), dy=CY-r*Math.cos(rad);
    // Depots 2,3,5,6: pull inward — vertical 30px, horizontal 20px
    switch(num){
      case 2: dx-=20; dy+=30; break;
      case 3: dx-=20; dy-=30; break;
      case 5: dx+=20; dy-=30; break;
      case 6: dx+=20; dy+=30; break;
    }
    const cx0=dx-CW/2, cy0=dy-CH/2;

    const dg=el('g',{cursor:'pointer','data-tip':'<b>仓库 '+num+'</b> · 骰子点数 '+num});

    // Card background
    dg.appendChild(el('rect',{x:cx0,y:cy0,width:CW,height:CH,rx:'10',fill:'#f0e8d0',stroke:'#a08060','stroke-width':'1.4'}));

    // Depot number + label — vertically centered in card
    const fill=num===6?'url(#d6g)':'#5a3d2b';
    const nt=el('text',{x:dx,y:dy,'text-anchor':'middle','dominant-baseline':'central','font-family':'Georgia,serif','font-size':'26','font-weight':'bold',fill,'pointer-events':'none'});
    nt.textContent=num;
    dg.appendChild(nt);

    // Hex tiles: 4 tiles in 2×2 diamond on OUTWARD side of each depot
    // Tiles face away from center: 1→up, 4→down, 2/3→right, 5/6→left
    const hexW=32, hexH=36;
    const hGap=34, vGap=38;
    let hPositions;
    switch(num){
      case 1: // ABOVE — horizontal row, vertically centered above card
        hPositions=[
          {cx:dx-51, cy:cy0-8},
          {cx:dx-17, cy:cy0-8},
          {cx:dx+17, cy:cy0-8},
          {cx:dx+51, cy:cy0-8},
        ];
        break;
      case 4: // BELOW — horizontal row, vertically centered below card
        hPositions=[
          {cx:dx-51, cy:cy0+CH+8},
          {cx:dx-17, cy:cy0+CH+8},
          {cx:dx+17, cy:cy0+CH+8},
          {cx:dx+51, cy:cy0+CH+8},
        ];
        break;
      case 2: case 3: // RIGHT
        hPositions=[
          {cx:cx0+CW+8,      cy:dy-vGap/2},
          {cx:cx0+CW+8,      cy:dy+vGap/2},
          {cx:cx0+CW+8+hGap, cy:dy-vGap/2},
          {cx:cx0+CW+8+hGap, cy:dy+vGap/2},
        ];
        break;
      case 5: case 6: // LEFT
        hPositions=[
          {cx:cx0-8,      cy:dy-vGap/2},
          {cx:cx0-8,      cy:dy+vGap/2},
          {cx:cx0-8-hGap, cy:dy-vGap/2},
          {cx:cx0-8-hGap, cy:dy+vGap/2},
        ];
        break;
    }

    hPositions.forEach((hp,hi)=>{
      let style='';
      let tip='板块位';
      if(num===6){
        style=hi%2===0?'fill:#d4e8d4;stroke:#7fa87f':'fill:#d8d8d8;stroke:#999';
        tip=hi%2===0?'城堡位 · A/C/E':'矿场位 · B/D';
      }
      const poly=el('polygon',{points:hexPts(hp.cx,hp.cy,hexW,hexH),fill:num===6?'':'#f5edd6',stroke:'#8B7355','stroke-width':'1.4',style:style||'fill:#f5edd6;stroke:#8B7355;stroke-width:1.4',cursor:'pointer','data-tip':tip});
      dg.appendChild(poly);
    });

    // Goods circle — inside card corner, avoid overlapping the number
    const goodsR=11;
    let gx, gy;
    switch(num){
      case 1: gx=cx0+CW-16; gy=cy0+CH-16; break;  // bottom-right (tiles are above)
      case 4: gx=cx0+CW-16; gy=cy0+CH-16; break;  // bottom-right (tiles are below)
      case 2: case 3: gx=cx0+16; gy=cy0+CH-16; break; // bottom-left (tiles are right)
      case 5: case 6: gx=cx0+CW-16; gy=cy0+CH-16; break; // bottom-right (tiles are left)
    }

    dg.appendChild(el('circle',{cx:gx,cy:gy,r:goodsR,fill:'#fff5e6',stroke:'#c9a96e','stroke-width':'1.4','stroke-dasharray':'5 3',cursor:'pointer','data-tip':'<b>货物区</b> · 放置船只时拿取全部货物'}));
    const gl=el('text',{x:gx,y:gy+1,'text-anchor':'middle','dominant-baseline':'central','font-family':'Georgia,serif','font-size':'6',fill:'#b08050','pointer-events':'none'});
    gl.textContent='货物';
    dg.appendChild(gl);

    // Depot 6 special legend
    if(num===6){
      const lx=cx0+CW-30, ly=cy0+3;
      dg.appendChild(el('rect',{x:lx,y:ly,width:26,height:10,rx:'2',fill:'#7fa87f'}));
      const t1=el('text',{x:lx+13,y:ly+7.5,'text-anchor':'middle','font-size':'5.5',fill:'#fff','font-family':'Georgia,serif'});
      t1.textContent='城堡';
      dg.appendChild(t1);
      dg.appendChild(el('rect',{x:lx,y:ly+12,width:26,height:10,rx:'2',fill:'#aaa'}));
      const t2=el('text',{x:lx+13,y:ly+19.5,'text-anchor':'middle','font-size':'5.5',fill:'#fff','font-family':'Georgia,serif'});
      t2.textContent='矿场';
      dg.appendChild(t2);
    }

    dWrap.appendChild(dg);
  });

  g.appendChild(dWrap);

  // ══════════════════════════════════════════════════════
  // BLACK MARKET (center) — 8 hexes, 3-2-3
  // ══════════════════════════════════════════════════════
  const bg=el('g',{'data-tip':'<b>黑市</b> · 2银币买任意板块 · 8格(3-2-3)',transform:'translate(0,-18)'});

  // Background
  bg.appendChild(el('rect',{x:CX-78,y:CY-42,width:156,height:118,rx:'12',fill:'#333',stroke:'#c9a96e','stroke-width':'2'}));

  // Title
  const bt=el('text',{x:CX,y:CY-58,'text-anchor':'middle','font-family':'Georgia,serif','font-size':'16','font-weight':'bold',fill:'#c9a96e'});
  bt.textContent='黑 市';
  bg.appendChild(bt);

  // 8 hexes: 3-2-3 arrangement
  const bHW=32, bHH=36;
  const bHexes=[
    // Row 1: 3 (cy = CY-12)
    {cx:CX-38, cy:CY-18},
    {cx:CX,    cy:CY-18},
    {cx:CX+38, cy:CY-18},
    // Row 2: 2 (cy = CY+24)
    {cx:CX-19, cy:CY+18},
    {cx:CX+19, cy:CY+18},
    // Row 3: 3 (cy = CY+60)
    {cx:CX-38, cy:CY+50},
    {cx:CX,    cy:CY+50},
    {cx:CX+38, cy:CY+50},
  ];
  bHexes.forEach(bh=>{
    bg.appendChild(el('polygon',{
      points:hexPts(bh.cx, bh.cy, bHW, bHH),
      fill:'#3a3a3a', stroke:'#c9a96e','stroke-width':'1.6',
      cursor:'pointer','data-tip':'黑市板块 · 2银币'
    }));
  });

  // Silver coin
  bg.appendChild(el('circle',{cx:CX-68,cy:CY+56,r:8,fill:'#bbb',stroke:'#888','stroke-width':'1'}));
  const ct=el('text',{x:CX-68,y:CY+59,'text-anchor':'middle','font-family':'Georgia,serif','font-size':'7','font-weight':'bold',fill:'#555'});
  ct.textContent='2';
  bg.appendChild(ct);

  g.appendChild(bg);
})();

// ══════════════════════════════════════════════════════════
// KNOWLEDGE HEXES (right-top panel)
// ══════════════════════════════════════════════════════════
(function(){
  const g=document.getElementById('know-hexes');
  const hw=32, hh=36;
  function hexPts(cx,cy,w,h){
    const qw=w/4, hw2=w/2, hh2=h/2;
    return `${cx},${cy-hh2} ${cx+hw2},${cy-qw} ${cx+hw2},${cy+qw} ${cx},${cy+hh2} ${cx-hw2},${cy+qw} ${cx-hw2},${cy-qw}`;
  }
  const positions=[
    [963,397],[999,397],[963,435],[999,435],
    [963,473],[999,473],[963,511],[999,511]
  ];
  positions.forEach((p,i)=>{
    const op=i>=6?'0.5':'1';
    g.appendChild(el('polygon',{
      points:hexPts(p[0],p[1],hw,hh),
      fill:'#fff3b0',stroke:'#d4a017','stroke-width':'1.4',
      opacity:op,cursor:'pointer','data-tip':'知识板块'
    }));
  });
})();

// ══════════════════════════════════════════════════════════
// BONUS SLOTS (right-bottom panel)
// ══════════════════════════════════════════════════════════
(function(){
  const g=document.getElementById('bonus-slots');
  function hexPts(cx,cy,w,h){
    const hw=w/2, hh=h/2, qw=w/4;
    return `${cx},${cy-hh} ${cx+hw},${cy-qw} ${cx+hw},${cy+qw} ${cx},${cy+hh} ${cx-hw},${cy+qw} ${cx-hw},${cy-qw}`;
  }
  const hexW=32, hexH=36;
  const items=[
    {label:'城堡',val:'8',color:'#c0392b',x:870,y:674},
    {label:'船只',val:'8',color:'#2471a3',x:928,y:674},
    {label:'知识',val:'8',color:'#7d6608',x:986,y:674},
    {label:'矿场',val:'5',color:'#888',x:870,y:707},
    {label:'动物',val:'5',color:'#2e7d32',x:928,y:707},
    {label:'建筑',val:'5',color:'#8B6914',x:986,y:707},
  ];
  items.forEach(it=>{
    const cx=it.x+26, cy=it.y+16;
    g.appendChild(el('polygon',{
      points:hexPts(cx,cy,hexW,hexH),
      fill:it.color,stroke:'#fff','stroke-width':'1.5',
      cursor:'pointer','data-tip':'<b>'+it.label+'</b> 区域奖励 '+it.val+'分'
    }));
    const lb=el('text',{x:cx,y:cy-3,'text-anchor':'middle','font-family':'Georgia,serif','font-size':'7','font-weight':'bold',fill:'#fff','pointer-events':'none'});
    lb.textContent=it.label;
    g.appendChild(lb);
    const vt=el('text',{x:cx,y:cy+11,'text-anchor':'middle','font-family':'Georgia,serif','font-size':'11','font-weight':'bold',fill:'#fff','pointer-events':'none'});
    vt.textContent=it.val;
    g.appendChild(vt);
  });
})();

// ══════════════════════════════════════════════════════════
// TOOLTIP
// ══════════════════════════════════════════════════════════
const tt=document.createElement('div');
tt.className='tt';
document.body.appendChild(tt);
document.querySelectorAll('[data-tip]').forEach(e=>{
  e.addEventListener('mouseenter',()=>{tt.innerHTML=e.getAttribute('data-tip');tt.style.display='block';});
  e.addEventListener('mousemove',ev=>{tt.style.left=Math.min(ev.clientX+12,innerWidth-280)+'px';tt.style.top=Math.min(ev.clientY+12,innerHeight-100)+'px';});
  e.addEventListener('mouseleave',()=>{tt.style.display='none';});
});
</script>
