h1{color:#e8d5b7;font-size:20px;margin-bottom:12px;text-shadow:1px 1px 3px rgba(0,0,0,.7);letter-spacing:2px}

svg{width:100%;height:auto;display:block}
.hex{fill:#f5edd6;stroke:#8B7355;stroke-width:1.4;transition:all .2s;cursor:pointer}
.hex:hover{fill:#fff8e1;stroke:#c9a96e;stroke-width:2.2;filter:drop-shadow(0 0 4px rgba(201,169,110,.5))}
.gc{fill:#fff5e6;stroke:#c9a96e;stroke-width:1.4;stroke-dasharray:5 3;transition:all .2s;cursor:pointer}

.dp{fill:#f0e8d0;stroke:#a08060;stroke-width:1.4;rx:12;transition:all .2s}
.dp:hover{stroke:#c9a96e;stroke-width:2.2}
.dn{font-size:38px;font-weight:bold;fill:#5a3d2b;text-anchor:middle;pointer-events:none}
.dl{font-size:10px;fill:#8B7355;text-anchor:middle;pointer-events:none}
.lb{fill:#5a3d2b;text-anchor:middle;pointer-events:none}
.ps{stroke:#8B7355;stroke-width:1.4;rx:6;cursor:pointer;transition:all .2s}
.ps:hover{filter:brightness(1.15)}
.pl{font-size:17px;font-weight:bold;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rb{fill:#fff;stroke:#8B7355;stroke-width:1.4;rx:5;cursor:pointer;transition:all .2s}
.rb:hover{fill:#fff8e1;stroke:#c9a96e}
.rn{font-size:13px;fill:#5a3d2b;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bs{fill:#faf6ed;stroke:#c9a96e;stroke-width:1;rx:6;cursor:pointer;transition:all .2s}
.bs:hover{fill:#fff8e1;stroke:#b8860b}
.tp{fill:#fff;stroke:#8B7355;stroke-width:1.4;rx:7;cursor:pointer;transition:all .2s}
.tp:hover{fill:#fff8e1;stroke:#c9a96e}
.kh{fill:#fff3b0;stroke:#d4a017;stroke-width:1.4;cursor:pointer;transition:all .2s}
.kh:hover{fill:#ffe680}
.tt{position:fixed;background:rgba(40,24,15,.96);color:#e8d5b7;padding:10px 14px;border-radius:8px;font-size:13px;max-width:260px;pointer-events:none;z-index:999;display:none;border:1px solid #c9a96e;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.tt b{color:#f0d68a}
.leg{color:#c9a96e;font-size:11px;margin-top:10px;text-align:center;max-width:1180px;line-height:1.8}
.leg span{display:inline-block;margin:0 6px}
.leg .d{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:3px}

<!-- ============================================================ -->
<!-- JS: Scoring track + Tooltip                                   -->
<!-- ============================================================ -->
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const g=document.getElementById('track');

  // Scoring track params: 1 point per box, clockwise
  const BW=28, BH=22, GAP=4;
  const HP=BW+GAP, VP=BH+GAP; // pitch: 32, 26

  // Board inner bounds for the track
  const xL=36, xR=1076, yT=36, yB=746;

  const boxes=[]; // {x, y, w, h}

  // Top row: L→R
  for(let x=xL; x+BW<=xR+10; x+=HP){
    if(x>xR-BW/2) break;
    boxes.push({x,y:yT,w:BW,h:BH});
  }
  const topN=boxes.length;

  // Right column: T→B (skip corner)
  const rX=xR-BW+2; // right edge aligned with top-right box
  for(let y=yT+VP; y+BH<=yB+10; y+=VP){
    if(y>yB-BH/2) break;
    boxes.push({x:rX,y,w:BW,h:BH});
  }
  const rightN=boxes.length-topN;

  // Bottom row: R→L (skip corner)
  for(let x=xR-HP; x>=xL; x-=HP){
    if(x+BW<xL+BW/2) break;
    boxes.push({x,y:yB,w:BW,h:BH});
  }
  const botN=boxes.length-topN-rightN;

  // Left column: B→T (skip both corners)
  for(let y=yB-VP; y>=yT+VP; y-=VP){
    if(y<yT+VP/2) break;
    boxes.push({x:xL,y,w:BW,h:BH});
  }

  const total=boxes.length;

  // Draw connecting arrows (subtle, between consecutive boxes)
  for(let i=0;i<total;i++){
    const a=boxes[i], b=boxes[(i+1)%total];
    const ax=a.x+a.w/2, ay=a.y+a.h/2;
    const bx=b.x+b.w/2, by=b.y+b.h/2;
    const dx=bx-ax, dy=by-ay;
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len<1) continue;
    const ux=dx/len, uy=dy/len;
    const shrink=Math.max(a.w,a.h)/2+2;
    const shrinkB=Math.max(b.w,b.h)/2+2;

    const line=document.createElementNS(NS,'line');
    line.setAttribute('x1', ax+ux*shrink);
    line.setAttribute('y1', ay+uy*shrink);
    line.setAttribute('x2', bx-ux*shrinkB);
    line.setAttribute('y2', by-uy*shrinkB);
    line.setAttribute('stroke','#c9a96e');
    line.setAttribute('stroke-width','1');
    line.setAttribute('opacity','0.4');
    g.appendChild(line);
  }

  // Draw boxes
  boxes.forEach((p,i)=>{
    const rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x',p.x);
    rect.setAttribute('y',p.y);
    rect.setAttribute('width',p.w);
    rect.setAttribute('height',p.h);
    rect.setAttribute('rx','4');
    rect.setAttribute('stroke','#a08060');
    rect.setAttribute('stroke-width','1');
    rect.setAttribute('cursor','pointer');

    // Color scheme: decade highlight, start marker
    if(i===0){
      rect.setAttribute('fill','#e8d8b0');
      rect.setAttribute('stroke','#c9a96e');
      rect.setAttribute('stroke-width','1.5');
    } else if(i%10===0){
      rect.setAttribute('fill','#f5ead0');
      rect.setAttribute('stroke','#b8960b');
      rect.setAttribute('stroke-width','1.2');
    } else if(i>=100){
      rect.setAttribute('fill','#faf4e8');
    } else {
      rect.setAttribute('fill','#f0e8d4');
    }
    rect.setAttribute('data-tip','<b>得分 '+i+'</b>'+(i%10===0&&i>0?' · 十分节点':''));
    g.appendChild(rect);

    // Number text
    const txt=document.createElementNS(NS,'text');
    txt.setAttribute('x', p.x+p.w/2);
    txt.setAttribute('y', p.y+p.h/2+1);
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('dominant-baseline','central');
    txt.setAttribute('font-family','Georgia,serif');
    txt.setAttribute('pointer-events','none');

    if(i===0){
      txt.setAttribute('font-size','9');
      txt.setAttribute('font-weight','bold');
      txt.setAttribute('fill','#8B6914');
      txt.textContent='START';
    } else if(i%10===0){
      txt.setAttribute('font-size','10');
      txt.setAttribute('font-weight','bold');
      txt.setAttribute('fill','#5a3d2b');
      txt.textContent=i;
    } else if(i>=100){
      txt.setAttribute('font-size','8');
      txt.setAttribute('fill','#6a5040');
      txt.textContent=i;
    } else {
      txt.setAttribute('font-size','9');
      txt.setAttribute('fill','#6a5040');
      txt.textContent=i;
    }
    g.appendChild(txt);
  });

  // START indicator arrow (below the start box)
  const s0=boxes[0];
  const arrow=document.createElementNS(NS,'text');
  arrow.setAttribute('x', s0.x+s0.w/2);
  arrow.setAttribute('y', s0.y+s0.h+10);
  arrow.setAttribute('text-anchor','middle');
  arrow.setAttribute('font-size','10');
  arrow.setAttribute('fill','#c9a96e');
  arrow.setAttribute('font-family','Georgia,serif');
  arrow.textContent='▲ START';
  g.appendChild(arrow);

  // Direction label on top-right (shows clockwise direction)
  const corner=boxes[topN-1]; // last top box
  const dirArrow=document.createElementNS(NS,'text');
  dirArrow.setAttribute('x', corner.x+corner.w+8);
  dirArrow.setAttribute('y', corner.y+corner.h/2+1);
  dirArrow.setAttribute('text-anchor','start');
  dirArrow.setAttribute('dominant-baseline','central');
  dirArrow.setAttribute('font-size','9');
  dirArrow.setAttribute('fill','#c9a96e');
  dirArrow.setAttribute('font-family','Georgia,serif');
  dirArrow.textContent='↓';
  g.appendChild(dirArrow);

  // Track title
  const title=document.createElementNS(NS,'text');
  title.setAttribute('x','570');
  title.setAttribute('y','26');
  title.setAttribute('text-anchor','middle');
  title.setAttribute('font-family','Georgia,serif');
  title.setAttribute('font-size','10');
  title.setAttribute('fill','#8B7355');
  title.setAttribute('letter-spacing','4');
  title.textContent='得分轨道 · 顺时针 · 1分/格 · 共'+total+'格';
  g.appendChild(title);

  // Total label
  const totalLabel=document.createElementNS(NS,'text');
  totalLabel.setAttribute('x', boxes[Math.floor(total/2)].x+BW/2);
  totalLabel.setAttribute('y', boxes[Math.floor(total/2)].y-6);
  totalLabel.setAttribute('text-anchor','middle');
  totalLabel.setAttribute('font-family','Georgia,serif');
  totalLabel.setAttribute('font-size','8');
  totalLabel.setAttribute('fill','#aaa');
  totalLabel.textContent='满一圈后可继续';
  g.appendChild(totalLabel);
})();

// Tooltip
const tt=document.createElement('div');
tt.className='tt';
document.body.appendChild(tt);
document.querySelectorAll('[data-tip]').forEach(el=>{
  el.addEventListener('mouseenter',e=>{
    tt.innerHTML=el.getAttribute('data-tip');
    tt.style.display='block';
  });
  el.addEventListener('mousemove',e=>{
    tt.style.left=Math.min(e.clientX+12,innerWidth-280)+'px';
    tt.style.top=Math.min(e.clientY+12,innerHeight-100)+'px';
  });
  el.addEventListener('mouseleave',()=>{tt.style.display='none';});
});
</script>
