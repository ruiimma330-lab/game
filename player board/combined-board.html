<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勃艮第城堡 — 完整版图（含玩家版图）</title>
<style>
html{overflow:auto}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(135deg,#2c1810,#4a2c17 50%,#2c1810);
  font-family:'Georgia','Noto Serif SC','SimSun','STSong',serif;
  display:flex;flex-direction:column;align-items:center;padding:20px
}
h1{color:#e8d5b7;font-size:20px;margin-bottom:16px;text-shadow:1px 1px 3px rgba(0,0,0,.7);letter-spacing:2px}
.container{position:relative;width:2400px;min-height:1900px;overflow:visible;background:rgba(0,0,0,.15);border-radius:16px;border:2px solid #5a3d2b}

/* Center board */
.cb-wrap{position:absolute;left:700px;top:595px;width:1000px}
.cb-wrap .wrap{background:#5a3d2b;padding:14px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.cb-wrap svg{width:100%;height:auto;display:block}
.cb-wrap .leg{color:#c9a96e;font-size:9px;margin-top:8px;text-align:center;line-height:1.6}
.cb-wrap .leg span{display:inline-block;margin:0 4px}
.cb-wrap .leg .d{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;margin-right:2px}

/* Player boards */
.player-slot{position:absolute;width:640px}
.player-slot .board{
  position:relative;width:640px;background:#f0debc;border-radius:18px;
  padding:6px 10px 6px;box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,245,225,.6);
  transform-origin:center center
}
.player-slot .plabel{
  position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  background:#b33;color:#fff;font-size:11px;font-weight:bold;padding:2px 14px;
  border-radius:0 0 8px 8px;letter-spacing:2px;z-index:10
}
.player-slot.p1 .board{transform:scale(0.65) rotate(0deg)}
.player-slot.p2 .board{transform:scale(0.65) rotate(270deg)}
.player-slot.p3 .board{transform:scale(0.65) rotate(180deg)}
.player-slot.p4 .board{transform:scale(0.65) rotate(90deg)}

/* Player board internal styles */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:0px}
.title-top{font-size:16px;color:#b33;font-weight:bold;letter-spacing:4px}
.goods-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.goods-wrap>label{font-size:12px;color:#b33;font-weight:bold;letter-spacing:1px}
.goods-row{display:flex;gap:5px}
.goods-cell{
  width:48px;height:52px;border:2px solid #6b4226;border-radius:4px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.06)
}
.goods-cell:nth-child(1){background:#b8a0d0}
.goods-cell:nth-child(2){background:#c4a882}
.goods-cell:nth-child(3){background:#dba870}
.goods-cell .g-icon{font-size:24px;line-height:1}
.g-die-face{
  display:inline-block;width:14px;height:14px;border-radius:2px;
  background:#f0f0f0;color:#333;font-size:9px;font-weight:bold;
  text-align:center;line-height:14px;box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 1px 0 #fff
}
.score-area{display:flex;align-items:center;gap:10px}
.dice-strip{display:flex;align-items:center;gap:6px}
.die{
  width:30px;height:30px;border-radius:4px;
  display:flex;justify-content:center;align-items:center;
  font-size:14px;font-weight:bold;color:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.25)
}
.die-blue{background:linear-gradient(135deg,#4a8fd4,#1a4a7a)}
.die-green{background:linear-gradient(135deg,#5cb85c,#2d7a2d)}
.score-box{
  background:#faf6ee;border:2px solid #6b4226;border-radius:6px;
  padding:2px 10px 4px;text-align:center;min-width:56px
}
.score-box label{font-size:12px;color:#b33;font-weight:bold;display:block}
.score-box .val{font-size:32px;font-weight:bold;color:#1f1208;line-height:1.1}
.main-area{display:flex;position:relative;min-height:280px}
.left-sidebar{
  position:absolute;left:2px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:12px;z-index:3
}
.res-card{
  background:rgba(250,246,238,.85);border:2px solid #6b4226;border-radius:8px;
  padding:6px 4px;text-align:center;min-width:48px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  box-shadow:0 2px 5px rgba(0,0,0,.08)
}
.res-card .r-icon{font-size:24px;line-height:1.2}
.res-card .r-label{font-size:10px;color:#b33;font-weight:bold;line-height:1.2}
.res-card .r-val{font-size:20px;font-weight:bold;color:#1f1208;line-height:1.1}
.hex-wrap{flex:1;display:flex;justify-content:center;align-items:center}
.hex-grid{position:relative;width:320px;height:270px;margin:0 auto}
.hex{
  position:absolute;width:43px;height:48px;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  user-select:none;cursor:default
}
.hex::after{
  content:'';position:absolute;inset:2px;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  border:1.5px solid rgba(0,0,0,.08);pointer-events:none;z-index:0
}
.hex-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0px;pointer-events:none}
.hex-in .h-icon{font-size:18px;line-height:1.1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.hex-in .h-lbl{font-size:9px;font-weight:bold;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);line-height:1.1}
.hex-in .h-die{
  width:12px;height:12px;border-radius:2px;
  display:flex;justify-content:center;align-items:center;
  font-size:7px;font-weight:bold;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);margin-top:1px
}
.t-pasture{background:linear-gradient(160deg,#8bc34a,#33691e)}
.t-river{background:linear-gradient(160deg,#64b5f6,#1565c0)}
.t-city{background:linear-gradient(160deg,#ffd54f,#f9a825)}
.t-knowledge{background:linear-gradient(160deg,#ffb74d,#e65100)}
.t-castle{background:linear-gradient(160deg,#ef5350,#b71c1c)}
.t-mine{background:linear-gradient(160deg,#bdbdbd,#616161)}
.t-special{background:linear-gradient(160deg,#ef5350,#b71c1c)}
.bottom-area{display:flex;justify-content:center;align-items:center;margin-top:2px;gap:20px}
.storage-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.storage-wrap>label{font-size:12px;color:#b33;font-weight:bold;letter-spacing:1px}
.storage-row{display:flex;gap:3px}
.s-hex{
  width:50px;height:44px;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  background:rgba(160,120,80,.04);border:2px dashed #a08060
}
.scroll{
  position:relative;
  background:linear-gradient(180deg,#faf3e0,#efe4c6);
  border:2px solid #7a4a2a;border-radius:4px 10px 10px 4px;
  padding:4px 12px;display:flex;align-items:center;gap:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,240,.5)
}
.scroll::before,.scroll::after{
  content:'';position:absolute;top:-2px;bottom:-2px;width:8px;
  background:linear-gradient(180deg,#c4a87a,#a08050,#8a6a3a,#c4a87a);
  border-radius:50%;border:1px solid #5a3420
}
.scroll::before{left:-5px}.scroll::after{right:-5px}
.scroll-item{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:bold;color:#2a1a0a}
.scroll-item .s-die{width:18px;height:18px;border-radius:2px;display:flex;justify-content:center;align-items:center;font-size:9px;font-weight:bold;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.scroll-item .s-mult{font-size:12px;color:#b33;font-weight:bold;border:1px solid #b8a080;border-radius:2px;padding:0 3px;background:rgba(255,248,235,.5)}
.scroll-item .s-dot{width:9px;height:9px;border-radius:50%;background:#333}

/* Tooltip */
.tt{position:fixed;background:rgba(40,24,15,.96);color:#e8d5b7;padding:10px 14px;border-radius:8px;font-size:13px;max-width:260px;pointer-events:none;z-index:999;display:none;border:1px solid #c9a96e;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.tt b{color:#f0d68a}
</style>
</head>
<body>
<h1>勃艮第城堡 — 完整版图</h1>
<div class="container">
  <!-- Center board -->
  <div class="cb-wrap" id="center-wrap"></div>

  <!-- Player board slots -->
  <div class="player-slot p1" id="slot-1" style="left:880px;top:1270px"></div>
  <div class="player-slot p2" id="slot-2" style="left:1539px;top:737px"></div>
  <div class="player-slot p3" id="slot-3" style="left:880px;top:233px"></div>
  <div class="player-slot p4" id="slot-4" style="left:221px;top:737px"></div>
</div>

<div class="tt" id="global-tt"></div>

<script>
// ═══════════════════════════════════════════════════════════
// PLAYER BOARD TEMPLATE
// ═══════════════════════════════════════════════════════════
function buildPlayerHTML(n){
  return '<div class="board" id="board-'+n+'"><div class="plabel">P'+n+'</div>'+
    '<div class="top-bar">'+
      '<div class="goods-wrap"><label>个人货物存储格</label>'+
        '<div class="goods-row">'+
          '<div class="goods-cell"><span class="g-icon">🍇</span><span class="g-die-face">1</span></div>'+
          '<div class="goods-cell"><span class="g-icon">🍷</span><span class="g-die-face">2</span></div>'+
          '<div class="goods-cell"><span class="g-icon">🍲</span><span class="g-die-face">3</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="title-top">玩家版图 P'+n+'</div>'+
      '<div class="score-area">'+
        '<div class="dice-strip"><div class="die die-blue">3</div><div class="die die-green">5</div></div>'+
        '<div class="score-box"><label>个人得分</label><div class="val">0</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="main-area">'+
      '<div class="left-sidebar">'+
        '<div class="res-card"><span class="r-icon">👷</span><span class="r-label">工人片</span><span class="r-val">2</span></div>'+
        '<div class="res-card"><span class="r-icon">🪙</span><span class="r-label">银币</span><span class="r-val">1</span></div>'+
      '</div>'+
      '<div class="hex-wrap"><div class="hex-grid" id="grid-'+n+'"></div></div>'+
    '</div>'+
    '<div class="bottom-area">'+
      '<div class="storage-wrap"><label>个人六角片仓库</label>'+
        '<div class="storage-row"><div class="s-hex"></div><div class="s-hex"></div><div class="s-hex"></div></div>'+
      '</div>'+
      '<div class="scroll">'+
        '<div class="scroll-item"><div class="s-die die-green">1</div><span class="s-mult">1x</span></div>'+
        '<div class="scroll-item"><span class="s-dot"></span><span class="s-mult">1x</span></div>'+
        '<div class="scroll-item"><div class="s-die die-green">2</div><span class="s-mult">2x</span></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

// HEX GRID RENDERER (player board)
// ═══════════════════════════════════════════════════════════
const W=43,H=48,VG=H*3/4;
const BX=31,BY=13;
const T={
  pasture:{i:'🌿',l:'牧场',c:'t-pasture',dc:'linear-gradient(135deg,#66bb6a,#2e7d32)'},
  river:{i:'🌊',l:'河流',c:'t-river',dc:'linear-gradient(135deg,#42a5f5,#0d47a1)'},
  city:{i:'🏙️',l:'城市',c:'t-city',dc:'linear-gradient(135deg,#ffca28,#f57f17)'},
  knowledge:{i:'📚',l:'知识',c:'t-knowledge',dc:'linear-gradient(135deg,#ffa726,#e65100)'},
  castle:{i:'🏰',l:'城堡',c:'t-castle',dc:'linear-gradient(135deg,#ef5350,#b71c1c)'},
  mine:{i:'⛏️',l:'矿坑',c:'t-mine',dc:'linear-gradient(135deg,#90a4ae,#455a64)'},
};
const DATA=[
  [0,1.5,'pasture'],[0,2.5,'castle'],[0,3.5,'castle'],[0,4.5,'knowledge'],
  [1,1.0,'pasture'],[1,2.0,'pasture'],[1,3.0,'castle'],[1,4.0,'knowledge'],[1,5.0,'city'],
  [2,0.5,'pasture'],[2,1.5,'pasture'],[2,2.5,'city'],[2,3.5,'knowledge'],[2,4.5,'city'],[2,5.5,'city'],
  [3,0.0,'river'],[3,1.0,'river'],[3,2.0,'river'],[3,3.0,'castle'],[3,4.0,'river'],[3,5.0,'river'],[3,6.0,'river'],
  [4,0.5,'city'],[4,1.5,'city'],[4,2.5,'mine'],[4,3.5,'city'],[4,4.5,'city'],[4,5.5,'pasture'],
  [5,1.0,'city'],[5,2.0,'mine'],[5,3.0,'knowledge'],[5,4.0,'city'],[5,5.0,'city'],
  [6,1.5,'mine'],[6,2.5,'knowledge'],[6,3.5,'knowledge'],[6,4.5,'city'],
];

function renderGrid(playerNum){
  const g=document.getElementById('grid-'+playerNum);
  if(!g)return;
  for(const d of DATA){
    const[r,c,tk,dv,mark,sp]=d,t=T[tk];
    const isSp=!!sp;
    const cx=BX+c*W, cy=BY+r*VG;
    const el=document.createElement('div');
    el.className='hex '+t.c;
    if(isSp)el.classList.add('t-special');
    el.style.left=(cx-W/2)+'px';
    el.style.top=(cy-H/2)+'px';
    const inner=document.createElement('div');
    inner.className='hex-in';
    const ic=document.createElement('span');
    ic.className='h-icon';
    ic.textContent=isSp?'🔥':(mark==='①'?'🏰':t.i);
    inner.appendChild(ic);
    const lb=document.createElement('span');
    lb.className='h-lbl';
    lb.textContent=t.l;
    inner.appendChild(lb);
    if(dv!==undefined){
      const die=document.createElement('div');
      die.className='h-die';
      die.textContent=dv;
      die.style.background=t.dc;
      inner.appendChild(die);
    }
    el.appendChild(inner);
    if(mark){
      const mk=document.createElement('div');
      mk.style.cssText='position:absolute;bottom:0;right:2px;font-size:13px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));pointer-events:none;z-index:2';
      mk.textContent=mark;
      el.appendChild(mk);
    }
    g.appendChild(el);
  }
}
// Initialize all 4 player boards
for(let i=1;i<=4;i++){
  const slot=document.getElementById('slot-'+i);
  slot.innerHTML=buildPlayerHTML(i);
  renderGrid(i);
}

  const NS='http://www.w3.org/2000/svg';
  const svg=document.getElementById('cb-svg');

  // Scoring track
  (function(){
    const g=document.getElementById('cb-track');
    const BW=26,BH=20,HP=30,VP=24,xL=34,xR=1078,yT=34,yB=752;
    const boxes=[];
    for(let x=xL;x+BW<=xR+8;x+=HP){if(x>xR-BW)break;boxes.push({x,y:yT,w:BW,h:BH});}
    const topN=boxes.length;
    const rX=xR-BW+2;
    for(let y=yT+VP;y+BH<=yB+8;y+=VP){if(y>yB-BH)break;boxes.push({x:rX,y,w:BW,h:BH});}
    const rightN=boxes.length-topN;
    for(let x=xR-HP;x>=xL;x-=HP){if(x+BW<xL+BW)break;boxes.push({x,y:yB,w:BW,h:BH});}
    const botN=boxes.length-topN-rightN;
    for(let y=yB-VP;y>=yT+VP;y-=VP){if(y<yT+VP)break;boxes.push({x:xL,y,w:BW,h:BH});}
    const total=boxes.length;
    for(let i=0;i<total;i++){
      const a=boxes[i],b=boxes[(i+1)%total];
      const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
      const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);
      if(len<2)continue;
      const ux=dx/len,uy=dy/len,s=Math.max(a.w,a.h)/2+1,s2=Math.max(b.w,b.h)/2+1;
      g.appendChild(el('line',{x1:ax+ux*s,y1:ay+uy*s,x2:bx-ux*s2,y2:by-uy*s2,stroke:'#c9a96e','stroke-width':'0.8',opacity:'0.35'}));
    }
    boxes.forEach((p,i)=>{
      const fill=i===0?'#e8d8b0':i%10===0?'#f5ead0':i>=100?'#faf4e8':'#f0e8d4';
      const sw=i===0?'1.5':i%10===0?'1.2':'0.8';
      const sc=i%10===0&&i>0?'#b8960b':'#a08060';
      g.appendChild(el('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:'3',fill,stroke:sc,'stroke-width':sw,cursor:'pointer','data-tip':'<b>得分 '+i+'</b>'+(i%10===0&&i>0?' · 十分节点':'')}));
      let txt;
      if(i===0){
        txt=el('text',{x:p.x+p.w/2,y:p.y+p.h/2+1,'text-anchor':'middle','dominant-baseline':'central','font-family':'Georgia,serif','font-size':'7','font-weight':'bold',fill:'#8B6914','pointer-events':'none'});
        txt.textContent='START';
      }else{
        const fs=i%10===0?'9':i>=100?'7':'8';
        const fw=i%10===0?'bold':'normal';
        const fc=i%10===0?'#5a3d2b':'#7a6a5a';
        txt=el('text',{x:p.x+p.w/2,y:p.y+p.h/2+1,'text-anchor':'middle','dominant-baseline':'central','font-family':'Georgia,serif','font-size':fs,'font-weight':fw,fill:fc,'pointer-events':'none'});
        txt.textContent=i;
      }
      g.appendChild(txt);
    });
    const t=el('text',{x:'570',y:'24','text-anchor':'middle','font-family':'Georgia,serif','font-size':'9',fill:'#8B7355','letter-spacing':'3'});
    t.textContent='得分轨道 · 顺时针 · 1分/格 · 共'+total+'格';

      const num=depotNums[idx],rad=deg*Math.PI/180,r=depotR(num);

    });
    angles.forEach((deg,idx)=>{
      const num=depotNums[idx],rad=deg*Math.PI/180,r=depotR(num);

      switch(num){case 2:dx-=20;dy+=30;break;case 3:dx-=20;dy-=30;break;case 5:dx+=20;dy-=30;break;case 6:dx+=20;dy+=30;break;}

      const dg=el('g',{cursor:'pointer','data-tip':'<b>仓库 '+num+'</b> · 骰子点数 '+num});

      dg.appendChild(el('rect',{x:cx0+2,y:cy0+2,width:CW-4,height:4,rx:'5',fill:'rgba(255,255,240,.4)','pointer-events':'none'}));
      const f=num===6?'url(#d6g)':'#5a3d2b';

      nt.textContent=num; dg.appendChild(nt);
      const hexW=32,hexH=36,hGap=34,vGap=38;
      let hp;
      switch(num){
        case 1:hp=[{cx:dx-51,cy:cy0-8},{cx:dx-17,cy:cy0-8},{cx:dx+17,cy:cy0-8},{cx:dx+51,cy:cy0-8}];break;

        case 2:case 3:hp=[{cx:cx0+CW+8,cy:dy-vGap/2},{cx:cx0+CW+8,cy:dy+vGap/2},{cx:cx0+CW+8+hGap,cy:dy-vGap/2},{cx:cx0+CW+8+hGap,cy:dy+vGap/2}];break;
        case 5:case 6:hp=[{cx:cx0-8,cy:dy-vGap/2},{cx:cx0-8,cy:dy+vGap/2},{cx:cx0-8-hGap,cy:dy-vGap/2},{cx:cx0-8-hGap,cy:dy+vGap/2}];break;
      }
      hp.forEach((h,hi)=>{
        let fill='#f5edd6',stroke='#8B7355',tip='板块位';
        if(num===6){fill=hi%2===0?'url(#g-castle)':'url(#g-mine)';stroke=hi%2===0?'#1b5e20':'#555';tip=hi%2===0?'城堡位 · A/C/E':'矿场位 · B/D';}
        dg.appendChild(el('polygon',{points:hexPts(h.cx,h.cy,hexW,hexH),fill,stroke,'stroke-width':'1.4',cursor:'pointer','data-tip':tip}));
        dg.appendChild(el('polygon',{points:hexPts(h.cx,h.cy,hexW-4,hexH-4),fill:'none',stroke:'rgba(0,0,0,.08)','stroke-width':'1','pointer-events':'none'}));
      });
      const goodsR=11;let gx,gy;
      switch(num){case 1:gx=cx0+CW-16;gy=cy0+CH-16;break;case 4:gx=cx0+CW-16;gy=cy0+CH-16;break;case 2:case 3:gx=cx0+16;gy=cy0+CH-16;break;case 5:case 6:gx=cx0+CW-16;gy=cy0+CH-16;break;}
      dg.appendChild(el('circle',{cx:gx,cy:gy,r:goodsR,fill:'#fff5e6',stroke:'#c9a96e','stroke-width':'1.4','stroke-dasharray':'5 3',cursor:'pointer','data-tip':'<b>货物区</b> · 放置船只时拿取全部货物'}));
      const gl=el('text',{x:gx,y:gy+1,'text-anchor':'middle','dominant-baseline':'central','font-family':'Georgia,serif','font-size':'6',fill:'#b08050','pointer-events':'none'});
      gl.textContent='货物';dg.appendChild(gl);
      if(num===6){
        const lx=cx0+CW-30,ly=cy0+3;
        dg.appendChild(el('rect',{x:lx,y:ly,width:26,height:10,rx:'2',fill:'url(#g-castle)'}));
        const t1=el('text',{x:lx+13,y:ly+7.5,'text-anchor':'middle','font-size':'5.5',fill:'#fff','font-family':'Georgia,serif'});
        t1.textContent='城堡';dg.appendChild(t1);
        dg.appendChild(el('rect',{x:lx,y:ly+12,width:26,height:10,rx:'2',fill:'url(#g-mine)'}));

        t2.textContent='矿场';dg.appendChild(t2);
      }
      dWrap.appendChild(dg);

    if(e.key==='Alt'&&!e.repeat){
      altDown=true;
      document.body.style.cursor='grab';
      e.preventDefault();
    }
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='Alt'){
      altDown=false;dragging=false;
      document.body.style.cursor='';
    }
  });
  document.addEventListener('mousedown',e=>{
    if(altDown&&e.button===0){
      dragging=true;sx=e.clientX-ox;sy=e.clientY-oy;
      document.body.style.cursor='grabbing';
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove',e=>{
    if(dragging&&altDown){
      ox=e.clientX-sx;oy=e.clientY-sy;
      c.style.transform='translate('+ox+'px,'+oy+'px)';
    }
  });
  document.addEventListener('mouseup',()=>{
    if(dragging){dragging=false;document.body.style.cursor=altDown?'grab':'';}
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='Alt')document.body.style.cursor='';
  });
})();
</script>
</body>
</html>
